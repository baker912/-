name: Deploy to Server

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境 (开启缓存)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # 自动缓存 node_modules

      # 3. 安装依赖 (只安装生产环境需要的依赖，如果可能)
      - name: Install dependencies
        run: npm ci # 使用 ci 命令比 install 更快更稳定

      # 4. 构建项目
      - name: Build project
        run: npm run build

      # 5. 打包构建产物 (压缩传输速度快10倍)
      - name: Compress dist
        run: tar -zcvf dist.tar.gz dist
      
      - name: Compress server
        run: tar -zcvf server.tar.gz server

      # 6. 传输压缩包到服务器
      - name: Upload to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist.tar.gz,server.tar.gz"
          target: "/tmp" # 先传到临时目录

      # 7. 解压并部署 (远程执行命令)
      - name: Extract and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # 遇到错误立即停止
            
            # 3. 解压并部署到多个可能的目录
            echo "Extracting new files..."
            
            # 定义可能的目标目录列表
            TARGET_DIRS=("/usr/share/nginx/html" "/var/www/html")
            
            # 标记是否成功部署到至少一个目录
            DEPLOYED=false
            
            for TARGET_DIR in "${TARGET_DIRS[@]}"; do
                # 检查目录是否存在（或者父目录存在）
                if [ -d "$TARGET_DIR" ] || [ -d "$(dirname "$TARGET_DIR")" ]; then
                    echo "----------------------------------------"
                    echo "Found target directory: $TARGET_DIR"
                    
                    # 确保目录存在
                    sudo mkdir -p $TARGET_DIR
                    
                    # 清空旧文件
                    sudo rm -rf $TARGET_DIR/*
                    
                    # 解压 (注意：tar 包还是那个 /tmp/dist.tar.gz)
                    sudo tar -zxvf /tmp/dist.tar.gz -C $TARGET_DIR --strip-components=1
                    
                    # 尝试设置所有权为 nginx:nginx (CentOS/Nginx 默认)
                    # 如果 nginx 用户不存在，尝试 apache，最后回退到 root
                    if id "nginx" &>/dev/null; then
                        sudo chown -R nginx:nginx $TARGET_DIR
                    elif id "apache" &>/dev/null; then
                        sudo chown -R apache:apache $TARGET_DIR
                    else
                        sudo chown -R root:root $TARGET_DIR
                    fi
                    
                    sudo chmod -R 755 $TARGET_DIR
                    
                    # SELinux 修复
                    if command -v restorecon >/dev/null 2>&1; then
                        echo "Applying SELinux contexts..."
                        sudo restorecon -R -v $TARGET_DIR || true
                    fi
                    
                    DEPLOYED=true
                    WEB_DIR=$TARGET_DIR
                    echo "Successfully deployed to $TARGET_DIR"
                fi
            done
            
            if [ "$DEPLOYED" = false ]; then
                echo "Error: No suitable deployment directory found!"
                exit 1
            fi
            
            sudo mkdir -p /opt/apps/asset-management
            sudo rm -rf /opt/apps/asset-management/server || true
            sudo mkdir -p /opt/apps/asset-management/server
            sudo tar -zxvf /tmp/server.tar.gz -C /opt/apps/asset-management/server --strip-components=1

            if [ -f /etc/yum.repos.d/docker-ce.repo ]; then
              sudo sed -i 's/enabled=1/enabled=0/g' /etc/yum.repos.d/docker-ce.repo || true
            fi

            if ! command -v node >/dev/null 2>&1; then
              sudo yum install -y nodejs || true
            fi
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo -E bash - || true
              sudo yum install -y nodejs || true
            fi

            cd /opt/apps/asset-management/server
            npm install --omit=dev --no-audit --no-fund

            cat > .env <<EOF
            PORT=4000
            HOST=127.0.0.1
            DATABASE_URL=${{ secrets.ASSET_DATABASE_URL }}
            JWT_SECRET=${{ secrets.ASSET_JWT_SECRET }}
            UPLOAD_DIR=uploads
            PUBLIC_BASE_URL=${{ secrets.ASSET_PUBLIC_BASE_URL }}
            EOF

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi
            if pm2 describe asset-api >/dev/null 2>&1; then
              pm2 restart asset-api --update-env
            else
              pm2 start src/index.js --name asset-api
            fi
            pm2 save

            sudo tee /etc/nginx/conf.d/asset-management.conf >/dev/null <<EOF
            server {
              listen 80;
              server_name ${{ secrets.SERVER_HOST }};

              root ${WEB_DIR};
              index index.html;

              location / {
                try_files \$uri \$uri/ /index.html;
              }

              location /api/ {
                proxy_pass http://127.0.0.1:4000/api/;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
              }

              location /storage/ {
                proxy_pass http://127.0.0.1:4000/storage/;
              }
            }
            EOF
            sudo nginx -t
            
            # 5. 重启 Nginx (Restart 比 Reload 更彻底)
            echo "Restarting Nginx..."
            sudo systemctl restart nginx || sudo service nginx restart || true
            
            sudo rm -f /tmp/dist.tar.gz /tmp/server.tar.gz || true
            
            echo "Deployment finished successfully!"
